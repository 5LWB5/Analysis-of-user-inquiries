<!doctype html>
<html lang="ru">

    <title>{% block title %}Обращения пользователей{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'tickets/style.css' %}">
</head>
<body>

        <a class="brand" href="{% url 'ticket_list' %}">Служба обращений</a>
